<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Tutoriels du Cours sélectionné</h2>
    
    <!-- Seul l'administrateur peut ajouter un tutoriel -->
    <a *ngIf="isAdmin" [routerLink]="['/course', courseId, 'add-tutorial']" class="btn btn-success text-white">
      + Ajouter un tutoriel à ce cours
    </a>
  </div>
  <hr>

  <div class="row">
    <div class="col-md-4 mb-4" *ngFor="let tutorial of tutorials">
      <div class="card shadow-sm h-100 p-3">
        <h5 class="card-title text-primary">{{ tutorial.title }}</h5>
        <p class="card-text text-muted">{{ tutorial.description }}</p>
        
        <div class="my-2" *ngIf="tutorial.pdf_url">
          <a [href]="tutorial.pdf_url" target="_blank" class="btn btn-outline-info btn-sm">
            📄 Voir le PDF
          </a>
        </div>

        <!-- Seul l'admin a accès à Modifier et Supprimer -->
        <div *ngIf="isAdmin" class="d-flex justify-content-end gap-2 mt-3">
          <a [routerLink]="['/doctutor', tutorial.id]" class="btn btn-warning btn-sm text-white">
            Modifier
          </a>
          <button class="btn btn-danger btn-sm" (click)="deleteTutorial(tutorial.id)">
            Supprimer
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
