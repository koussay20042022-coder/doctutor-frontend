<div class="container mt-4" style="max-width: 600px;">
  <h2 class="mb-4">Ajouter un nouveau cours</h2>

  <div class="form-group mb-3">
    <label for="title" class="form-label">Titre du cours</label>
    <input 
      type="text" 
      class="form-control" 
      id="title" 
      [(ngModel)]="courseTitle" 
      placeholder="Ex: Réseaux" 
    />
  </div>

  <div class="form-group mb-4">
    <label for="teacher" class="form-label">Nom de l'enseignant (Optionnel)</label>
    <input 
      type="text" 
      class="form-control" 
      id="teacher" 
      [(ngModel)]="teacherName" 
      placeholder="Ex: Dr. Martin" 
    />
  </div>

  <button (click)="saveCourse()" class="btn btn-success">Submit</button>
</div>
